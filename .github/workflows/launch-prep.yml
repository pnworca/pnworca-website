# Temporary: applies rest.patch and lpdata.py and fetches the logo files, then removes itself.
name: launch-prep-apply
on:
  push:
    branches: [launch-prep]
    paths: [".github/workflows/launch-prep.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          git apply rest.patch && python3 lpdata.py
          for c in Black Blue DarkGray LightGray Orange White Yellow; do
            curl -fsSL -o src/assets/wp/PNWORCA_Lockup_$c.png https://pnworca.org/wp-content/uploads/2019/03/PNWORCA_Lockup_$c.png
          done
          git rm -q rest.patch lpdata.py .github/workflows/launch-prep.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Launch prep: race details, privacy page, logo files, Beyond the PNW, link cleanup"
          git push
