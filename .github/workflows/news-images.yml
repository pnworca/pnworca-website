name: Build news image copies
# One-time job: runs scripts/responsive-images.mjs and commits the new
# image copies and src/_data/images.json. Delete after it runs.
on:
  push:
    branches: [news-images]
    paths: [.github/workflows/news-images.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/responsive-images.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/assets src/_data/images.json
          git commit -m "Add WebP copies of news photos and 2x logo copies" -m "Generated by scripts/responsive-images.mjs with sharp 0.35.5."
          git push
