name: Build image copies
# One-time job: installs the pinned image and font packages, runs
# scripts/responsive-images.mjs and commits the smaller image copies,
# src/_data/images.json and the updated package files. Delete after it runs.
on:
  push:
    branches: [perf]
    paths: [.github/workflows/perf-assets.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned packages
        run: |
          npm install --save-exact --save-dev sharp@0.35.5
          npm install --save-exact @fontsource/roboto-condensed@5.3.0 @fontsource/source-sans-3@5.3.1
      - name: Make image copies
        run: node scripts/responsive-images.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/assets/img src/_data/images.json
          git commit -m "Add smaller image copies, image manifest and pinned packages" -m "Generated by scripts/responsive-images.mjs with sharp 0.35.5."
          git push
