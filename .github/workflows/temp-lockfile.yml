# Temporary: generates package-lock.json on this branch. Delete before merging.
name: temp-lockfile
on:
  push:
    branches: [eleventy-scaffold]
    paths: ["package.json", ".github/workflows/temp-lockfile.yml"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Add package-lock.json"
          git push
