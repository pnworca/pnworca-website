# Temporary: moves flattened upload files into src/. Delete before merging.
name: temp-relayout
on:
  push:
    branches: [homepage-v3]
    paths: [".github/workflows/temp-relayout.yml"]
permissions:
  contents: write
jobs:
  relayout:
    runs-on: ubuntu-latest
